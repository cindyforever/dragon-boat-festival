- generic [ref=e2]: "<!DOCTYPE html> <html lang=\"zh-CN\"> <head> <meta charset=\"UTF-8\"> <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"> <title>AI绘梦·粽情告白 - 端午祝福</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { min-height: 100vh; background: linear-gradient(135deg, #c41e3a 0%, #8b0000 50%, #c41e3a 100%); font-family: \"PingFang SC\", \"Microsoft YaHei\", \"STHeiti\", sans-serif; overflow-x: hidden; } /* 顶部装饰 */ .top-deco { text-align: center; padding: 20px; font-size: 2rem; letter-spacing: 15px; } .top-deco span { display: inline-block; animation: float 2s ease-in-out infinite; } .top-deco span:nth-child(2) { animation-delay: 0.1s; } .top-deco span:nth-child(3) { animation-delay: 0.2s; } .top-deco span:nth-child(4) { animation-delay: 0.3s; } .top-deco span:nth-child(5) { animation-delay: 0.4s; } @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } } /* 底部装饰 */ .bottom-deco { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; display: flex; justify-content: center; align-items: center; gap: 50px; font-size: 1.8rem; padding-bottom: 10px; pointer-events: none; } .bottom-deco span { opacity: 0.7; } /* 主容器 */ .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; } /* 标题区 */ .title-section { text-align: center; margin-bottom: 25px; } .main-title { font-size: 2.2rem; color: #ffd700; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); letter-spacing: 8px; margin-bottom: 10px; } .sub-title { font-size: 0.95rem; color: rgba(255,255,255,0.85); letter-spacing: 3px; } /* 日期标签 */ .date-tag { display: inline-block; background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); color: #8b0000; padding: 10px 25px; border-radius: 25px; font-size: 1rem; letter-spacing: 3px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(255,215,0,0.3); } /* 主视觉区 */ .main-visual { text-align: center; margin-bottom: 30px; } .main-visual img { width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); } /* 祝福输入区 */ .input-section { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); } .input-label { font-size: 1.1rem; color: #8b0000; margin-bottom: 15px; letter-spacing: 3px; text-align: center; } .input-box { position: relative; } .input-box textarea { width: 100%; padding: 15px; border: 2px solid #ffd700; border-radius: 15px; font-size: 1rem; font-family: inherit; resize: none; height: 100px; color: #333; background: #fffaf0; } .input-box textarea::placeholder { color: #999; } .input-box textarea:focus { outline: none; border-color: #ff8c00; } .char-count { position: absolute; bottom: 10px; right: 15px; font-size: 0.85rem; color: #999; } /* 预设祝福语 */ .preset-section { margin-top: 15px; } .preset-title { font-size: 0.9rem; color: #666; margin-bottom: 10px; letter-spacing: 2px; } .preset-list { display: flex; flex-wrap: wrap; gap: 8px; } .preset-item { padding: 8px 15px; background: linear-gradient(135deg, #fff5ee 0%, #ffe4e1 100%); border: 1px solid #ffd700; border-radius: 20px; font-size: 0.85rem; color: #c41e3a; cursor: pointer; transition: all 0.3s ease; } .preset-item:hover { background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); color: #fff; } .preset-item.selected { background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%); color: #fff; border-color: #c41e3a; } /* 生成按钮 */ .generate-btn { display: block; width: 100%; padding: 18px; font-size: 1.2rem; color: #fff; background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); border: none; border-radius: 30px; cursor: pointer; letter-spacing: 5px; box-shadow: 0 6px 25px rgba(255,215,0,0.4); transition: all 0.3s ease; } .generate-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255,215,0,0.5); } /* 分享文案区 */ .share-section { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px; margin-top: 20px; display: none; box-shadow: 0 8px 30px rgba(0,0,0,0.2); } .share-section.active { display: block; animation: fadeIn 0.3s ease; } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } .share-title { font-size: 1rem; color: #8b0000; margin-bottom: 15px; letter-spacing: 2px; text-align: center; } .share-text { width: 100%; padding: 15px; border: 2px solid #ffd700; border-radius: 12px; font-size: 0.9rem; font-family: inherit; resize: none; height: 150px; color: #333; background: #fffaf0; line-height: 1.8; } .copy-btn { display: block; width: 100%; margin-top: 15px; padding: 15px; font-size: 1.1rem; color: #fff; background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%); border: none; border-radius: 25px; cursor: pointer; letter-spacing: 3px; box-shadow: 0 4px 15px rgba(196,30,58,0.4); transition: all 0.3s ease; } .copy-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(196,30,58,0.5); } /* 回复祝福按钮 */ .reply-section { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; } .reply-btn { padding: 15px 35px; font-size: 1.1rem; color: #fff; background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); border: none; border-radius: 30px; cursor: pointer; letter-spacing: 3px; box-shadow: 0 6px 25px rgba(255,215,0,0.4); transition: all 0.3s ease; } .reply-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255,215,0,0.5); } /* 接收方视图 - 祝福展示 */ .blessing-display { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 30px; margin-bottom: 20px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.2); display: none; } .blessing-display.active { display: block; } .blessing-display .sender-info { font-size: 0.9rem; color: #c41e3a; margin-bottom: 15px; letter-spacing: 2px; } .blessing-display .blessing-text { font-size: 1.3rem; color: #333; line-height: 1.8; padding: 20px; background: linear-gradient(135deg, #fff5ee 0%, #ffe4e1 100%); border-radius: 15px; border: 2px solid #ffd700; } /* 飘字效果 */ .float-text { position: fixed; font-size: 1.2rem; font-weight: bold; pointer-events: none; opacity: 0; z-index: 1000; } .float-text.positive { color: #ff6b6b; } .float-text.negative { color: #4ecdc4; } @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.2); } } </style> </head> <body> <!-- 顶部装饰 --> <div class=\"top-deco\"> <span>🎋</span> <span>🍃</span> <span>🍙</span> <span>🍂</span> <span>🐉</span> </div> <div class=\"container\" id=\"mainContainer\"> <!-- 标题区 --> <div class=\"title-section\"> <h1 class=\"main-title\">粽情端午 · 智趣同行</h1> <p class=\"sub-title\">服务与软件研发管理部上研分部 2026端午活动</p> </div> <!-- 日期标签 --> <div style=\"text-align: center;\"> <span class=\"date-tag\">🎋 五月初五 · 端午安康</span> </div> <!-- 主视觉区 --> <div class=\"main-visual\"> <img src=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23c41e3a'/%3E%3Cstop offset='100%25' style='stop-color:%238b0000'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect fill='url(%23bg)' width='400' height='300'/%3E%3Ctext x='200' y='130' text-anchor='middle' font-size='60'%3E🐲%3C/text%3E%3Ctext x='200' y='180' text-anchor='middle' font-size='24' fill='%23ffd700'%3E端午安康%3C/text%3E%3Ctext x='200' y='220' text-anchor='middle' font-size='16' fill='%23fff'%3E艾草飘香 · 粽享欢乐%3C/text%3E%3Ctext x='200' y='260' text-anchor='middle' font-size='20'%3E🫔🚣🌿🏮🎋%3C/text%3E%3C/svg%3E\" alt=\"端午主题\"> </div> <!-- 祝福输入区（发送方） --> <div class=\"input-section\" id=\"inputSection\"> <div class=\"input-label\">端午祝福语</div> <div class=\"input-box\"> <textarea id=\"blessingInput\" placeholder=\"写下你的端午祝福\" maxlength=\"100\" oninput=\"updateCharCount()\"></textarea> <span class=\"char-count\"><span id=\"charCount\">0</span> / 100</span> </div> <!-- 预设祝福语 --> <div class=\"preset-section\"> <div class=\"preset-title\">或选择以下祝福：</div> <div class=\"preset-list\"> <span class=\"preset-item\" onclick=\"selectPreset(this)\">端午安康！愿你事事顺心</span> <span class=\"preset-item\" onclick=\"selectPreset(this)\">粽香飘万里，情深意更浓</span> <span class=\"preset-item\" onclick=\"selectPreset(this)\">龙舟竞渡，好运连连</span> <span class=\"preset-item\" onclick=\"selectPreset(this)\">端午吉祥，阖家幸福</span> </div> </div> </div> <!-- 生成按钮 --> <button class=\"generate-btn\" onclick=\"generateShare()\">✨ 生成专属祝福海报</button> <!-- 分享文案区 --> <div class=\"share-section\" id=\"shareSection\"> <div class=\"share-title\">📝 一键复制祝福语发送给同事</div> <textarea class=\"share-text\" id=\"shareText\" readonly></textarea> <button class=\"copy-btn\" onclick=\"copyShare()\">📋 一键复制</button> </div> </div> <!-- 底部装饰 --> <div class=\"bottom-deco\"> <span>🎋</span> <span>🍃</span> <span>🍙</span> <span>🍂</span> <span>🐉</span> </div> <!-- 回复祝福按钮（接收方显示） --> <div class=\"reply-section\" id=\"replySection\" style=\"display:none;\"> <button class=\"reply-btn\" onclick=\"goToSend()\">💬 我也要送祝福</button> </div> <!-- 飘字效果容器 --> <div id=\"floatContainer\"></div> <script> // 更新字数统计 function updateCharCount() { const input = document.getElementById('blessingInput'); document.getElementById('charCount').textContent = input.value.length; } // 选择预设祝福语 function selectPreset(element) { document.querySelectorAll('.preset-item').forEach(item => { item.classList.remove('selected'); }); element.classList.add('selected'); document.getElementById('blessingInput').value = element.textContent; updateCharCount(); } // 获取当前祝福语 function getBlessing() { const input = document.getElementById('blessingInput').value.trim(); if (input) return input; const selected = document.querySelector('.preset-item.selected'); if (selected) return selected.textContent; return '端午安康！愿你粽享欢乐'; } // 生成分享文案 function generateShare() { const blessing = getBlessing(); // 获取当前页面的完整路径 const currentPath = window.location.pathname; // 将file:/// 替换为空，或者使用当前路径 let baseUrl = currentPath; // 如果是Windows本地文件路径 if (baseUrl.indexOf('/C:') === 0) { // 转换 Windows 路径为可用URL baseUrl = baseUrl.replace(/\\\\/g, '/'); } // 如果路径不是以http开头，手动添加file协议 if (baseUrl.indexOf('http') !== 0) { // 使用localhost方式访问时可以直接使用路径 // 或者用户需要部署到服务器 baseUrl = baseUrl; } // 只使用祝福语参数，姓名暂时不添加 const shareUrl = baseUrl + '?blessing=' + encodeURIComponent(blessing); const shareText = `【粽情端午 · 智趣同行——服务与软件研发管理部上研分部端午活动】 AI绘梦·粽情告白😄亲爱的伙伴祝你${blessing} 点击链接 接好运，生成你的端午祝福专属海报🐉 ${shareUrl}`; document.getElementById('shareText').value = shareText; document.getElementById('shareSection').classList.add('active'); // 滚动到分享区域 document.getElementById('shareSection').scrollIntoView({ behavior: 'smooth', block: 'center' }); } // 复制分享文案 function copyShare() { const text = document.getElementById('shareText').value; // 尝试使用剪贴板API if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function() { alert('已复制！可粘贴到WeLink发送给同事~'); }, function(err) { // 失败时使用后备方案 fallbackCopy(text); }); } else { fallbackCopy(text); } } // 备用复制方法 function fallbackCopy(text) { // 创建一个临时的输入框 const input = document.createElement('input'); input.style.position = 'fixed'; input.style.top = '0'; input.style.left = '0'; input.style.opacity = '0'; input.style.zIndex = '-1000'; input.value = text; document.body.appendChild(input); try { input.select(); input.setSelectionRange(0, 99999); // 移动端需要 const successful = document.execCommand('copy'); if (successful) { alert('已复制！可粘贴到WeLink发送给同事~'); } else { // 尝试另一种方式 const textArea = document.createElement('textarea'); textArea.value = text; textArea.style.position = 'fixed'; textArea.style.left = '-9999px'; document.body.appendChild(textArea); textArea.focus(); textArea.select(); if (document.execCommand('copy')) { alert('已复制！可粘贴到WeLink发送给同事~'); } else { alert('复制失败，请手动长按文本复制'); } document.body.removeChild(textArea); } } catch (err) { alert('复制失败，请手动长按文本复制'); } document.body.removeChild(input); } // 跳转到发送页面 function goToSend() { // 清除URL参数，返回发送页面 const baseUrl = window.location.pathname; window.location.href = baseUrl; } // 显示飘字效果 function showFloatText(x, y, text, isPositive) { const container = document.getElementById('floatContainer'); const floatEl = document.createElement('div'); floatEl.className = 'float-text ' + (isPositive ? 'positive' : 'negative'); floatEl.textContent = text; floatEl.style.left = x + 'px'; floatEl.style.top = y + 'px'; floatEl.style.animation = 'floatUp 1s ease-out forwards'; container.appendChild(floatEl); setTimeout(() => floatEl.remove(), 1000); } // 页面加载时检查URL参数 window.onload = function() { const urlParams = new URLSearchParams(window.location.search); const blessingParam = urlParams.get('blessing'); if (blessingParam) { // 接收方视图 const decodedBlessing = decodeURIComponent(blessingParam); // 显示祝福展示区 const displayHtml = ` <div class=\"blessing-display active\"> <div class=\"sender-info\">—— 服务与软件研发管理部上研分部端午祝福</div> <div class=\"blessing-text\">${decodedBlessing}</div> </div> `; document.getElementById('inputSection').style.display = 'none'; document.querySelector('.generate-btn').style.display = 'none'; document.getElementById('mainContainer').insertAdjacentHTML('afterbegin', displayHtml); // 显示回复按钮 document.getElementById('replySection').style.display = 'block'; } }; // 底部装饰点击效果 document.querySelectorAll('.bottom-deco span').forEach((el, index) => { const effects = ['好运+100', '健康+100', '事业+80', '财运+100', '福气+90']; el.style.pointerEvents = 'auto'; el.style.cursor = 'pointer'; el.addEventListener('click', (e) => { showFloatText(e.clientX, e.clientY - 30, effects[index], true); }); }); </script> </body> </html>"