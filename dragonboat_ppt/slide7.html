<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #FFE4B5;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}
.header-bar {
    background: #E07A5F;
    height: 55pt;
    display: flex;
    align-items: center;
    padding: 0 40pt;
}
.title {
    font-size: 26pt;
    font-weight: bold;
    color: white;
    margin: 0;
}
.content-area {
    display: flex;
    flex: 1;
    padding: 18pt 35pt;
    gap: 25pt;
}
.main-content {
    flex: 1.2;
    display: flex;
    flex-direction: column;
    gap: 15pt;
}
.card-display {
    flex: 1;
    background: white;
    border-radius: 12pt;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    position: relative;
}
.card-inner {
    width: 180pt;
    height: 130pt;
    background: #FFF8E7;
    border-radius: 10pt;
    border: 3pt solid #F5B841;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.card-emoji {
    font-size: 40pt;
    margin-bottom: 8pt;
}
.card-text {
    font-size: 16pt;
    font-weight: bold;
    color: #2D5A27;
    margin: 4pt 0;
}
.card-subtext {
    font-size: 10pt;
    color: #888;
    margin: 0;
}
.info-cards {
    display: flex;
    gap: 12pt;
}
.info-card {
    flex: 1;
    background: white;
    border-radius: 10pt;
    padding: 12pt;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.08);
}
.info-icon {
    font-size: 20pt;
    margin-bottom: 6pt;
}
.info-title {
    font-size: 11pt;
    font-weight: bold;
    color: #1C3A5F;
    margin: 0 0 4pt 0;
}
.info-desc {
    font-size: 8pt;
    color: #666;
    margin: 0;
    line-height: 1.3;
}
.side-content {
    flex: 0.8;
    display: flex;
    flex-direction: column;
    gap: 10pt;
}
.step-card {
    background: white;
    border-radius: 10pt;
    padding: 12pt;
    display: flex;
    align-items: center;
    gap: 12pt;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.08);
}
.step-num {
    width: 30pt;
    height: 30pt;
    border-radius: 50%;
    background: #E07A5F;
    color: white;
    font-size: 14pt;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
}
.step-text {
    font-size: 10pt;
    color: #333;
    margin: 0;
}
.highlight-box {
    background: #2D5A27;
    border-radius: 10pt;
    padding: 12pt;
    text-align: center;
}
.highlight-text {
    font-size: 11pt;
    color: white;
    margin: 0;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="header-bar">
    <h1 class="title">💌 好运"粽"动员，幸福派送中</h1>
</div>

<div class="content-area">
    <div class="main-content">
        <div class="card-display">
            <div class="card-inner">
                <p class="card-emoji">🎁</p>
                <p class="card-text">端午安康</p>
                <p class="card-subtext">粽叶飘香 · 幸福绵长</p>
            </div>
        </div>
        
        <div class="info-cards">
            <div class="info-card">
                <p class="info-icon">🔗</p>
                <h4 class="info-title">温情连接</h4>
                <p class="info-desc">打破场地限制，让因工作无法到场的同事也能参与互动</p>
            </div>
            <div class="info-card">
                <p class="info-icon">🎁</p>
                <h4 class="info-title">惊喜体验</h4>
                <p class="info-desc">收到祝福贺卡的惊喜感，增强员工归属感</p>
            </div>
            <div class="info-card">
                <p class="info-icon">🎨</p>
                <h4 class="info-title">文化传递</h4>
                <p class="info-desc">贺卡融入端午元素，传统与现代的美好结合</p>
            </div>
        </div>
    </div>
    
    <div class="side-content">
        <div class="step-card">
            <div class="step-num"><p>1</p></div>
            <p class="step-text">选择精美端午电子贺卡</p>
        </div>
        <div class="step-card">
            <div class="step-num"><p>2</p></div>
            <p class="step-text">撰写个性化祝福语</p>
        </div>
        <div class="step-card">
            <div class="step-num"><p>3</p></div>
            <p class="step-text">定向或随机送给同事</p>
        </div>
        <div class="step-card">
            <div class="step-num"><p>4</p></div>
            <p class="step-text">收集祝福，收获温暖</p>
        </div>
        
        <div class="highlight-box">
            <p class="highlight-text">📩 活动日前上线专属H5平台<br/>全天可参与，随时传递祝福</p>
        </div>
    </div>
</div>
</body>
</html>
