<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #1C3A5F;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}
.top-decoration {
    position: absolute;
    top: 20pt;
    right: 40pt;
    width: 150pt;
    height: 80pt;
    background: #2D5A27;
    border-radius: 0 0 0 50pt;
    opacity: 0.8;
}
.bottom-decoration {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 300pt;
    height: 150pt;
    background: #4A7C59;
    border-radius: 0 100pt 0 0;
    opacity: 0.6;
}
.main-title {
    position: relative;
    z-index: 10;
    text-align: center;
    margin-bottom: 15pt;
}
.title-zong {
    font-size: 44pt;
    font-weight: bold;
    color: #F5B841;
    margin: 0;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}
.subtitle-line {
    font-size: 22pt;
    color: #FFF8E7;
    margin: 5pt 0;
}
.info-box {
    background: rgba(255,248,231,0.15);
    border: 1pt solid #F5B841;
    border-radius: 8pt;
    padding: 12pt 30pt;
    margin-top: 20pt;
}
.dept-text {
    font-size: 14pt;
    color: #FFF8E7;
    margin: 3pt 0;
}
.date-text {
    font-size: 14pt;
    color: #FFF8E7;
    margin: 3pt 0;
}
</style>
</head>
<body>
<div class="top-decoration"></div>
<div class="bottom-decoration"></div>

<div class="main-title">
    <h1 class="title-zong">粽情端午，"码"上启航</h1>
    <p class="subtitle-line">——上研分部2026年端午节活动方案</p>
</div>

<div class="info-box">
    <p class="dept-text">服务与软件研发管理部 上研分部</p>
    <p class="date-text">2026年6月18日 (周五) 12:00 - 13:00</p>
</div>
</body>
</html>
