<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #E8F5E9;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}
.header-bar {
    background: #2D5A27;
    height: 55pt;
    display: flex;
    align-items: center;
    padding: 0 40pt;
}
.title {
    font-size: 24pt;
    font-weight: bold;
    color: #FFF8E7;
    margin: 0;
}
.timeline-container {
    flex: 1;
    padding: 25pt 40pt;
}
.main-timeline {
    position: relative;
    height: 150pt;
    margin-bottom: 25pt;
}
.timeline-line {
    position: absolute;
    top: 45%;
    left: 5%;
    width: 90%;
    height: 4pt;
    background: #4A7C59;
    border-radius: 2pt;
}
.timeline-node {
    position: absolute;
    top: 45%;
    transform: translate(-50%, -50%);
    width: 45pt;
    height: 45pt;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
}
.node-icon {
    font-size: 18pt;
}
.node-time {
    font-size: 7pt;
    font-weight: bold;
    color: white;
    margin-top: 1pt;
}
.node-start { background: #F5B841; }
.node-1 { background: #4A7C59; left: 20%; }
.node-2 { background: #E07A5F; left: 40%; }
.node-3 { background: #2C5F7C; left: 60%; }
.node-end { background: #F5B841; left: 85%; }

.node-label {
    position: absolute;
    top: 75%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9pt;
    color: #1C3A5F;
    font-weight: bold;
    white-space: nowrap;
}
.node-desc {
    position: absolute;
    top: 88%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 7pt;
    color: #666;
    white-space: nowrap;
}

.online-timeline {
    position: relative;
    margin-top: 15pt;
    padding: 12pt 18pt;
    background: #FFF8E7;
    border-radius: 10pt;
    border: 2pt dashed #F5B841;
}
.online-label {
    position: absolute;
    top: -10pt;
    left: 25pt;
    background: #F5B841;
    padding: 2pt 12pt;
    border-radius: 10pt;
    font-size: 9pt;
    font-weight: bold;
    color: white;
}
.online-content {
    display: flex;
    align-items: center;
    gap: 15pt;
    margin-top: 5pt;
}
.online-icon {
    font-size: 26pt;
}
.online-text {
    font-size: 11pt;
    color: #1C3A5F;
    margin: 0;
}
.online-time {
    font-size: 9pt;
    color: #666;
    margin: 0;
    margin-left: auto;
}

.legend {
    position: absolute;
    bottom: 15pt;
    right: 40pt;
    display: flex;
    gap: 12pt;
}
.legend-item {
    display: flex;
    align-items: center;
    gap: 4pt;
}
.legend-dot {
    width: 10pt;
    height: 10pt;
    border-radius: 50%;
}
.legend-text {
    font-size: 8pt;
    color: #666;
}
</style>
</head>
<body>
<div class="header-bar">
    <h1 class="title">活动流程总览 | 6月18日 中午12:00-13:00</h1>
</div>

<div class="timeline-container">
    <div class="main-timeline">
        <div class="timeline-line"></div>
        
        <div class="timeline-node node-start">
            <span class="node-icon">🎬</span>
            <span class="node-time">12:00</span>
        </div>
        <p class="node-label" style="left: 5%;">活动开场</p>
        <p class="node-desc" style="left: 5%;">分组</p>
        
        <div class="timeline-node node-1">
            <span class="node-icon">🧧</span>
            <span class="node-time">12:10</span>
        </div>
        <p class="node-label" style="left: 20%;">主题体验区</p>
        <p class="node-desc" style="left: 20%;">包粽子·香囊</p>
        
        <div class="timeline-node node-2">
            <span class="node-icon">🎮</span>
            <span class="node-time">12:10</span>
        </div>
        <p class="node-label" style="left: 40%;">竞技游戏区</p>
        <p class="node-desc" style="left: 40%;">划龙舟·套圈</p>
        
        <div class="timeline-node node-3">
            <span class="node-icon">📸</span>
            <span class="node-time">12:50</span>
        </div>
        <p class="node-label" style="left: 60%;">合影留念</p>
        <p class="node-desc" style="left: 60%;">礼品发放</p>
        
        <div class="timeline-node node-end">
            <span class="node-icon">🏁</span>
            <span class="node-time">13:00</span>
        </div>
        <p class="node-label" style="left: 85%;">活动结束</p>
    </div>
    
    <div class="online-timeline">
        <span class="online-label">📩 好运粽动员</span>
        <div class="online-content">
            <span class="online-icon">💌</span>
            <div>
                <p class="online-text">线上祝福活动 · 幸福派送中</p>
                <p class="online-time">贯穿全天，随时传递祝福</p>
            </div>
        </div>
    </div>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background: #4A7C59;"></div>
            <span class="legend-text">线下体验</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #E07A5F;"></div>
            <span class="legend-text">线下竞技</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #F5B841;"></div>
            <span class="legend-text">线上祝福</span>
        </div>
    </div>
</div>
</body>
</html>
